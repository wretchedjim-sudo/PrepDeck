<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
  
<script>
  window.addEventListener("error", function (event) {
    document.body.innerHTML =
      '<main id="prepdeck-runtime-error-overlay" style="min-height:100vh;background:#eef1f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:28px;">' +
      '<section style="max-width:900px;margin:40px auto;background:white;border:1px solid rgba(17,24,39,.12);border-radius:16px;padding:24px;box-shadow:0 18px 40px rgba(15,23,42,.12);">' +
      '<h1 style="margin-top:0;">PrepDeck hit an error</h1>' +
      '<p>This was the blank white screen. Copy this message:</p>' +
      '<pre style="white-space:pre-wrap;background:#f8fafc;border:1px solid rgba(17,24,39,.12);border-radius:12px;padding:14px;overflow:auto;">' +
      String(event.message || "Unknown error") +
      '</pre></section></main>';
  });

  window.addEventListener("unhandledrejection", function (event) {
    document.body.innerHTML =
      '<main id="prepdeck-runtime-error-overlay" style="min-height:100vh;background:#eef1f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:28px;">' +
      '<section style="max-width:900px;margin:40px auto;background:white;border:1px solid rgba(17,24,39,.12);border-radius:16px;padding:24px;box-shadow:0 18px 40px rgba(15,23,42,.12);">' +
      '<h1 style="margin-top:0;">PrepDeck hit an error</h1>' +
      '<p>This was the blank white screen. Copy this message:</p>' +
      '<pre style="white-space:pre-wrap;background:#f8fafc;border:1px solid rgba(17,24,39,.12);border-radius:12px;padding:14px;overflow:auto;">' +
      String((event.reason && event.reason.message) || event.reason || "Unknown promise error") +
      '</pre></section></main>';
  });
</script>

</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
